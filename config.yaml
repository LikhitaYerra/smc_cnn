project:
  name: "CNN Adaptive Sliding Mode Control for Autonomous Robot"
  version: "0.1.0"

simulation:
  dt: 0.01
  total_time: 20.0

robot:
  wheel_base: 0.3
  wheel_radius: 0.05
  initial_state:
    x: 0.0
    y: 0.0
    theta: 0.0

controller:
  smc:
    lambda: 2.0
    K: 1.5
    phi: 0.1
    max_linear_velocity: 1.0
    max_angular_velocity: 2.0

trajectory:
  type: "circle"
  radius: 2.0
  angular_speed: 0.2

noise:
  enabled: false
  position_std: 0.01
  theta_std: 0.005

disturbance:
  enabled: false
  start_time: 8.0
  duration: 1.0
  force_level: 0.2